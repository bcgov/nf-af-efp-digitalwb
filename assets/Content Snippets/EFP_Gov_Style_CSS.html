<style>
  /* ---
    -------------------
    FILE INFO
    -------------------
    version: 1.1.0
    name: EFP_Gov_Style_CSS
    type: Content Snippet
    description: This is the CSS used on the Home Page.
  --- */
  /* --- BC Gov theme tokens --- */
  :root {
    --bcgov-blue: #003366;
    --bcgov-blue-70: #1a5a96;
    --bcgov-gold: #fcba19;
    --bcgov-text: #313132;
    --bcgov-muted: #666;
    --bcgov-link: #1a5a96;
    --bcgov-bg: #fafafa; 
    --bcgov-info-bg: #e6f4f9;
    --bcgov-info-border: #1a5a96;
  }

  /* Base page styles */
  .bcgov-page {
    font-family: 'BCSans', 'Noto Sans', Arial, Helvetica, sans-serif;
    color: var(--bcgov-text);
    background: var(--bcgov-bg);
    line-height: 1.6;
  }
  .bcgov-page .container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* Headings */
  .bcgov-page h2 {
    color: var(--bcgov-blue);
    font-weight: 700;
    margin: 16px 0 8px;
    font-size: 1.8rem;
    position: relative;
    padding-top: 8px;
  }
  .bcgov-page h2::after {
    content: '';
    display: block;
    width: 56px;
    height: 4px;
    background: var(--bcgov-gold);
    margin-top: 12px;
  }
  .bcgov-page h3 {
    font-size: 1.2rem;
    margin: 16px 0 8px;
    font-weight: 700;
  }

  /* Links */
  .bcgov-page a {
    color: var(--bcgov-link);
    text-decoration: none !important;
  }
  .bcgov-page a:hover {
    text-decoration: none;
  }

  /* Buttons */
  .bcgov-page .button1,
  .bcgov-btn--primary {
    background: var(--bcgov-blue) !important;
    color: #ffffff !important;
    border: 1px solid var(--bcgov-blue) !important;
    padding: 10px 16px;
    border-radius: 4px;
    text-decoration: none !important;
    display: inline-block;
    font-weight: 800;
    font-size: 16px !important;
  }
  .bcgov-page .button1:hover,
  .bcgov-btn--primary:hover {
    background: var(--bcgov-blue-70) !important;
    border-color: var(--bcgov-blue-70) !important;
  }

  .bcgov-page .button2,
  .bcgov-btn--secondary {
    background: #ffffff !important;
    color: #2D2D2D !important;
    border: 1px solid #353433 !important;
    padding: 10px 16px;
    border-radius: 4px;
    text-decoration: none !important;
    display: inline-block;
    font-weight: 800;
    font-size: 16px;
  }
  .bcgov-page .button2:hover,
  .bcgov-btn--secondary:hover {
    background: #eceae8 !important;
    border: 1px solid #353433 !important;
  }

  /* Banner */
  .bcgov-banner {
    background: var(--bcgov-info-bg);
    border-left: 4px solid var(--bcgov-info-border);
    padding: 14px 16px;
    border-radius: 4px;
    margin: 12px 0 20px;
  }
  .bcgov-banner .title {
    font-weight: 700;
    margin-bottom: 6px;
  }

  /* Tables (entity lists included) */
  .bcgov-page table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0 20px;
    background: #fff;
    border: 1px solid #e0e0e0;
  }
  .bcgov-page thead th {
    background: var(--bcgov-blue);
    color: #fff;
    text-align: left;
    padding: 10px 12px;
    font-weight: 700;
  }
  .bcgov-page tbody td {
    padding: 10px 12px;
    border-top: 1px solid #eee;
  }
  .bcgov-page tbody tr:nth-child(odd) {
    background: #fafbfd;
  }

  /* Section spacing */
  .bcgov-page section {
    margin-bottom: 12px;
  }

  /* Status debug (optional) */
  .bcgov-status {
    font-size: 13px;
    margin: 6px 0 8px;
    color: var(--bcgov-muted);
  }

  /* Make the entire page background match the BC Gov surface */
  html,
  body,
  .wrapper-body,
  #mainContent,
  .page-copy {
    background: var(--bcgov-bg) !important;
  }

  /* Ensure inner DIVs don’t re-introduce a white panel */
  .xrm-editable-html,
  .xrm-attribute,
  .xrm-attribute-value {
    background: transparent !important;
  }

  /* --- BC Gov Header Navigation Fix --- */
  .navbar.navbar-dark,
  .navbar.navbar-dark .navbar-brand,
  .navbar.navbar-dark .navbar-header {
    background-color: var(--bcgov-blue) !important;
    color: #ffffff !important;
  }

  /* Top-level nav links */
  .navbar-dark .nav-link,
  .navbar-dark .username,
  .navbar-dark .navbar-brand,
  .navbar-dark .siteTitle,
  .navbar-dark .custom-sitetitle {
    color: #ffffff !important;
    cursor: pointer !important;
  }

  /* Hover state */
  .navbar-dark .nav-link:hover,
  .navbar-dark .username:hover,
  .navbar-dark .navbar-brand:hover,
  .navbar-dark .siteTitle:hover {
    color: #FFFFFF !important;
    text-decoration: none !important;
    text-decoration-line: none !important;
  }

  .siteTitle .custom-sitetitle {
    text-decoration: none !important;
    text-decoration-line: none !important;
  }

  .siteTitle:hover .custom-sitetitle:hover {
    color: #FFFFFF !important;
    text-decoration: none !important;
    text-decoration-line: none !important;
  }

  /* Vertical nav dividers */
  .navbar-dark .divider-vertical {
    border-left: 1px solid rgba(255, 255, 255, 0.4) !important;
    margin: 0 12px;
  }

  /* Dropdown menu styling - Dark theme matching BC Gov sidebar */
  .navbar-dark .dropdown-menu {
    background-color: #38598A !important;  /* BC Gov sidebar blue */
    border: 1px solid #2D4A73 !important;
    border-radius: 4px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  }
  .navbar-dark .dropdown-menu .dropdown-item {
    color: #ffffff !important;
    padding: 10px 16px;
    cursor: pointer !important;
  }
  .navbar-dark .dropdown-menu .dropdown-item:hover,
  .navbar-dark .dropdown-menu .dropdown-item:focus {
    background-color: #2D4A73 !important;  /* Slightly darker on hover */
    color: var(--bcgov-gold) !important;   /* Gold text on hover */
  }
  .navbar-dark .dropdown-menu .dropdown-item.active,
  .navbar-dark .dropdown-menu .dropdown-item:active {
    background-color: #1E3A5F !important;  /* Active state */
    color: var(--bcgov-gold) !important;
  }
  .navbar-dark .dropdown-menu .dropdown-divider {
    border-top-color: rgba(255, 255, 255, 0.2) !important;
  }
  .bcgov-content h2 {
    color: black !important;
  }
</style>
